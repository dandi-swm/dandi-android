name: Release (Play internal)

# 공개 저장소라 시크릿이 외부 PR 에 노출되지 않도록 수동 실행과 태그 push 로만 돈다.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "버전 이름 (예: 2.2.3, 앞의 v 없이)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  internal:
    name: Upload to Play internal track
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    env:
      # 빌드 스크립트가 환경변수로 읽는 값(local.properties 가 없을 때)
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      API_BASE_URL_PROD: ${{ secrets.API_BASE_URL_PROD }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
      KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      AIRBRIDGE_SDK_TOKEN: ${{ secrets.AIRBRIDGE_SDK_TOKEN }}

    steps:
      - name: Check required secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                      API_BASE_URL_PROD META_APP_ID META_CLIENT_TOKEN \
                      KAKAO_NATIVE_APP_KEY GOOGLE_WEB_CLIENT_ID AIRBRIDGE_SDK_TOKEN \
                      GOOGLE_SERVICES_JSON_B64 PLAY_SERVICE_ACCOUNT_JSON_B64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::release environment 에 등록되지 않은 시크릿:$missing (docs/DEVELOPMENT.md 의 배포 절 참고)"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # 태그 커밋이 main 의 조상인지 보려면 전체 이력이 필요하다.
          fetch-depth: 0

      # 수동 실행은 main 에서만, 태그는 main 에 들어간 커밋에서만 배포한다.
      - name: Check release ref
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::수동 실행은 main 브랜치에서만 할 수 있습니다(현재 $GITHUB_REF)."
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 origin/main 에 없습니다. main 에 머지된 커밋에만 태그를 붙이세요."
            exit 1
          fi

      # 태그는 앞의 v 를 뗀 값, 수동 실행은 입력값을 버전 이름으로 쓴다. 입력은 env 로만 받는다.
      - name: Resolve version name
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version_name="$INPUT_VERSION_NAME"
          else
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version_name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::버전 이름은 숫자.숫자.숫자 형식이어야 합니다(예: 2.2.3)."
            exit 1
          fi
          echo "NYUMMY_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "versionName $version_name"

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # 공개 저장소의 Actions 캐시는 다른 실행에서 읽힐 수 있어, 운영 키가 든 release 빌드 결과를 올리지 않는다.
          cache-disabled: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # 시크릿 파일은 runner 임시 경로에 풀고, 값은 로그에 찍지 않는다.
      - name: Restore secret files
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          umask 077
          secret_dir="$RUNNER_TEMP/release-secrets"
          mkdir -p "$secret_dir"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$secret_dir/release.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 -d > "$secret_dir/play-service-account.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          echo "RELEASE_STORE_FILE=$secret_dir/release.jks" >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$secret_dir/play-service-account.json" >> "$GITHUB_ENV"

      - name: Build and upload to internal track
        run: bundle exec fastlane android internal

      - name: Clean up secret files
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-secrets" app/google-services.json
