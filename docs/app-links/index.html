<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>냐미 앱에서 열기</title>
<!--
  link.nyummy.co.kr 폴백 페이지.
  앱 링크가 앱으로 열리지 못한 경우(앱 미설치, 브라우저에서 직접 열기 등)에만 보인다.
  CloudFront 오류 응답에서 403/404 → /index.html(200) 으로 매핑해 모든 경로가 이 페이지로 떨어지게 한다.
  색은 앱 디자인 토큰(Ivory25 / Cocoa900 / Cocoa600 / Evergreen700)과 맞춘다.
-->
<style>
  :root {
    --bg: #FFFDF9;
    --text: #241610;
    --text-sub: #594238;
    --primary: #547A61;
    --on-primary: #FFFFFF;
    --border: #DDE7DE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 24px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p {
    color: var(--text-sub);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }
  .hint {
    font-size: 13px;
    margin-top: 20px;
    margin-bottom: 0;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>냐미 앱에서 열어주세요</h1>
  <p>이 링크는 냐미(Nyummy) 앱 안의 화면으로 연결돼요.</p>
  <a id="open-app" class="btn primary" href="#" hidden>앱에서 열기</a>
  <a id="store" class="btn" href="https://play.google.com/store/apps/details?id=com.dandi.nyummy">Google Play에서 받기</a>
  <p id="hint" class="hint" hidden>안드로이드 기기에서 링크를 열면 앱으로 바로 이동해요.</p>
</main>
<script>
(function () {
  var PACKAGE = 'com.dandi.nyummy';
  var STORE_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  var isAndroid = /Android/i.test(navigator.userAgent);
  var openApp = document.getElementById('open-app');
  var hint = document.getElementById('hint');

  if (!isAndroid) {
    hint.hidden = false;
    return;
  }

  // 원래 경로를 그대로 앱에 넘긴다. 앱이 없으면 Chrome 이 fallback URL(Play 스토어)로 보낸다.
  var intentUrl = 'intent://' + location.host + location.pathname + location.search +
    '#Intent;scheme=https;package=' + PACKAGE +
    ';S.browser_fallback_url=' + encodeURIComponent(STORE_URL) + ';end';
  openApp.href = intentUrl;
  openApp.hidden = false;

  // 페이지가 뜬 직후 한 번 자동으로 시도한다. 실패해도 버튼은 남아 있다.
  setTimeout(function () { location.href = intentUrl; }, 300);
})();
</script>
</body>
</html>
