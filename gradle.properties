# Project-wide Gradle settings.
# Gradle 데몬 힙. CI(:app:assembleDebug :app:lintDebug)에서 lint 분석과 APK 패키징(:app:packageDebug)이 한 데몬에서 겹쳐
# 2GB로는 Java heap space OOM이나 GC로 멈추는 일이 났다(2026-11-22 run 45009443855, 44993907656). 4GB로 올린다.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin 컴파일 데몬은 따로 뜨고 기본으로 위 값을 물려받는다. 지금까지처럼 2GB로 묶어 전체 메모리가 두 배로 늘지 않게 한다.
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
